; Z2S Gateway built with pioarduino (Arduino core 3.3.6, ESP-IDF 5.5).
; Same options as the C6 8MB build in .github/workflows/main.yml.

[platformio]
src_dir = examples/Z2S_Gateway
default_envs = esp32c6_8MB

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
extra_scripts =
  pre:core/pio_patch_core.py
  post:core/pio_patch_supla_device.py
; registry copies pulled in by library manifests are replaced by the forks below
lib_ignore =
  ESP Async WebServer
  Async TCP
lib_deps =
  Z2S_Library=symlink://.
  https://github.com/lsroka76/supla-device.git#d470d462a7bd84675ebb95601a78151f9a053b5d
  https://github.com/LennartHennigs/ESPTelnet.git#27de3ca875df74ac8f123071de61d7d0a0d6724b
  https://github.com/adafruit/Adafruit_NeoPixel.git#d514fc3beae85dd4c2b19781b93faa47bd6e996f
  https://github.com/dojyorin/arduino_base64.git#bfdc6f1b3c0560afe6d5c7b27bbb8644ab127254
  https://github.com/lsroka76/ESPUI.git#5639f63cd18c2e71ff7b646cc5dc918b96ecffcd
  https://github.com/bblanchon/ArduinoJson.git#1cd478f48e7c4cd142a0bd26ee17d63d70d04e3f
  https://github.com/lsroka76/ESPAsyncWebServer.git#461667528e44ff6b9d4982e0a27bf1560031470f
  https://github.com/lsroka76/AsyncTCP.git#3e91a84412a14abac98b78a18ef6793430a6110a
  https://github.com/mobizt/ESP_SSLClient.git#5d6af6320872e0c15a62614c7317849f62f9dabc
  https://github.com/milesburton/Arduino-Temperature-Control-Library.git#dadbbf7d33f500a5785ac4ae9973b8c9083d0d39
  https://github.com/PaulStoffregen/OneWire.git#800f26f3ee6eb446a72e013785cac3700e54cc13
; Z2S has functions without return; arduino-cli does not treat it as error
build_unflags = -Werror=return-type
build_flags =
  -DESPASYNCHTTPUPDATESERVER_MODE=1
  -DCORE_DEBUG_LEVEL=5

[env:esp32c6_8MB]
board = esp32-c6-devkitc-1
board_build.partitions = ${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/zigbee_zczr_8MB.csv
board_upload.flash_size = 8MB
board_build.flash_mode = dio
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DZIGBEE_MODE_ZCZR
  -lesp_zb_api.zczr
  -lzboss_stack.zczr
  -lzboss_port.native

; Same as above with the Arduino core libraries rebuilt: mbedTLS buffers
; allocated only while needed and more sockets for multidevice sessions.
[env:esp32c6_8MB_dyn]
extends = env:esp32c6_8MB
; DTLS excludes dynamic buffers; OpenThread needs DTLS (neither used by Z2S)
custom_sdkconfig =
  '# CONFIG_OPENTHREAD_ENABLED is not set'
  '# CONFIG_MBEDTLS_SSL_PROTO_DTLS is not set'
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
  '# CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE is not set'
  CONFIG_LWIP_MAX_SOCKETS=32
  CONFIG_LWIP_MAX_ACTIVE_TCP=32
extra_scripts =
  ${env.extra_scripts}
  post:core/pio_custom_sdkconfig.py
; text files embedded by IDF components of the core
custom_embed_asm_txtfiles =
  managed_components/espressif__esp_insights/server_certs/https_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
  managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
