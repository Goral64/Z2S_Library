name: Build multidevice
on:
  push:
    branches: [multidevice]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    name: Build C6 8MB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile
        run: pio run -e esp32c6_8MB_dyn
      - name: Collect binaries
        run: |
          VERSION=$(sed -n 's/#define Z2S_VERSION "Z2S-\([0-9.]*\)-.*"/\1/p' examples/Z2S_Gateway/z2s_version_info.h)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          BUILD=.pio/build/esp32c6_8MB_dyn
          mkdir out
          cp $BUILD/firmware.bin out/Z2S_Gateway.multidevice.8MB.OTA.logs.update_only.bin
          ~/.platformio/penv/bin/python ~/.platformio/packages/tool-esptoolpy/esptool.py \
            --chip esp32c6 merge_bin --flash_mode dio --flash_size 8MB \
            -o out/Z2S_Gateway.multidevice.8MB.OTA.logs.full_version.bin \
            0x0 $BUILD/bootloader.bin 0x8000 $BUILD/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $BUILD/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Z2S_Gateway.multidevice-${{ env.VERSION }}-${{ github.run_number }}
          path: out/*.bin
      - name: Create a GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=multidevice-$VERSION-${{ github.run_number }}
          gh release create $TAG out/*.bin --prerelease --target ${{ github.sha }} \
            --title "Multidevice $VERSION (build ${{ github.run_number }})" \
            --notes "Experimental multidevice build for ESP32-C6 with 8 MB flash, based on Z2S $VERSION.
          full_version: flash at 0x0. update_only: OTA update of a gateway already running an 8 MB build."
